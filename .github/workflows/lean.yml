name: Lean
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true
      - name: Check transitive axioms
        run: lake env lean Audit.lean
      - name: Check the numbered statements in the report
        run: lake env lean docs/ReportStatements.lean
